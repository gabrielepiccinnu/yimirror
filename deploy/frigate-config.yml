# Config Frigate — camera "ingresso" dal proxy video interno.
# Record 24/7 con retention 7 giorni. Detect disattivato (si attiva in seguito).
mqtt:
  enabled: false

cameras:
  ingresso:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://bridge:{FRIGATE_RTSP_PASSWORD}@mediamtx:8554/ingresso
          roles:
            - record
    record:
      enabled: true
      retain:
        days: 7
        mode: all
