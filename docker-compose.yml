# Deploy Dokploy — ingest della diretta.
# Routing + TLS gestiti dal DOMINIO Dokploy (domain.create); auth via
# header X-Ingest-Token (64 hex) + rate limit interno (10 POST/min per IP).

services:
  ingest:
    build: .
    image: yimirror-ingest:local
    container_name: yimirror-ingest
    restart: unless-stopped
    entrypoint: ["python"]  # override ENTRYPOINT del Dockerfile (src.main)
    environment:
      - YIMIRROR_INGEST_TOKEN=${YIMIRROR_INGEST_TOKEN}
      - TZ=${TZ:-Europe/Rome}
      - YIMIRROR_RETENTION_DAYS=${YIMIRROR_RETENTION_DAYS:-7}
    volumes:
      - yimirror-data:/data
    command: ["-m", "src.ingest", "--port", "8088", "--data", "/data",
              "--retention-days", "7"]
    ports:
      - "8088:8088"
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    external: true
    name: dokploy-network

volumes:
  yimirror-data:
