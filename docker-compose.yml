# yimirror — bridge della diretta + mirror clip + server di ingest (opzionale)
#
# servizio `bridge`: cattura la sorgente video TNP (sniffer UDP, host network + NET_RAW)
#   e consegna i segmenti a: ingest HTTP (sotto) oppure rclone (B2/Drive) oppure local.
# servizio `ingest`: il TUO server di storage — salva i segmenti e tiene la retention.
#   Se hai già un server, esegui lì solo `src/ingest.py` e punta YIMIRROR_INGEST_URL.

services:
  bridge:
    build: .
    container_name: yimirror-bridge
    restart: unless-stopped
    network_mode: host          # deve vedere il traffico UDP del device/emulatore
    cap_add:
      - NET_RAW                 # socket raw per lo sniffer
    environment:
      - YIMIRROR_DATA_DIR=/data
      - YIMIRROR_UPLOAD=${YIMIRROR_UPLOAD:-http}        # http | rclone | local
      - YIMIRROR_INGEST_URL=${YIMIRROR_INGEST_URL:-http://127.0.0.1:8088}
      - YIMIRROR_TNP_HOST=${YIMIRROR_TNP_HOST:-82.192.139.67}
      - YIMIRROR_RETENTION_DAYS=${YIMIRROR_RETENTION_DAYS:-7}
      - TZ=Europe/Rome
    volumes:
      - ./data:/data
    command: ["python", "-m", "src.live", "--seconds", "60"]

  ingest:
    build: .
    container_name: yimirror-ingest
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - YIMIRROR_INGEST_TOKEN=${YIMIRROR_INGEST_TOKEN:-}
      - TZ=Europe/Rome
    volumes:
      - ./ingest-data:/data
    command: ["python", "-m", "src.ingest", "--port", "8088",
              "--data", "/data", "--retention-days", "7"]
